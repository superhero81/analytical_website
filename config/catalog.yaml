catalog:
  name: "HR Dashboard AI-adatkatalógus"
  version: "0.1.0"
  language: "hu"
  description: >-
    Géppel és ember által is olvasható tudásréteg a HR Dashboard három
    összekapcsolható szintetikus adatállományának helyes értelmezéséhez.
  official_cutoff_date: "2026-06-30"
  data_nature: "synthetic"

organization_context:
  organization_type: "fiktív ipari-technológiai nagyvállalat"
  industry: "ipari termelés és technológiai megoldások"
  description: >
    A vállalat ipari berendezéseket és intelligens műszaki
    megoldásokat gyárt. Saját termelési, értékesítési,
    informatikai, adat- és szoftverfejlesztési területekkel rendelkezik.
  status: "demo_assumption"

datasets:
  - id: "employee"
    name: "Munkavállalói törzsadatok"
    file: "employee_data_clean.csv"
    detail_catalog: "datasets/employee.yaml"

  - id: "engagement"
    name: "Féléves engagement-felmérések"
    file: "employee_engagement_survey_data_clean.csv"
    detail_catalog: "datasets/engagement.yaml"

  - id: "training"
    name: "Képzési, teljesítési és képzési visszajelzési adatok"
    file: "training_and_development_data_clean.csv"
    detail_catalog: "datasets/training.yaml"

relationships:
  - id: "employee_to_engagement"
    parent_dataset: "employee"
    child_dataset: "engagement"
    join_key: "EmpID"
    cardinality: "one_to_many"

  - id: "employee_to_training"
    parent_dataset: "employee"
    child_dataset: "training"
    join_key: "EmpID"
    cardinality: "one_to_many"

global_ai_rules:
  - "A hiányzó vagy nem dokumentált adatot tilos kitalálni."
  - "Ha a kérdés a rendelkezésre álló adatokból nem válaszolható meg, ezt egyértelműen jelezni kell."
  - "Ha a kérdés többféleképpen értelmezhető, és ez érdemben befolyásolja az eredményt, pontosító kérdést kell feltenni."
  - "A válaszban meg kell különböztetni a tárolt tényt, a számított eredményt, a kimutatott összefüggést és a feltételezett magyarázatot."
  - "Kimutatott összefüggésből nem állapítható meg automatikusan ok-okozati kapcsolat."
  - "Az elemzés nem terjedhet ki a hivatalos záródátum utáni időszakra."

privacy_rules:
  prefer_aggregated_results: true
  minimum_group_size: 4
  suppress_groups_below_minimum: true
  rules:
    - "Az egyéni HR-adatokat nem szabad megjeleníteni, ha a kérdés aggregált elemzéssel megválaszolható."
    - "Név, e-mail-cím és más közvetlen személyazonosító adat elemzési válaszban nem jeleníthető meg."
    - "Az 1–3 fős csoportok eredményét külön nem szabad közölni."

time_rules:
  official_cutoff_date: "2026-06-30"
  employee_period_fields:
    start: "StartDate"
    end: "ExitDate"
  engagement_fields:
    wave: "SurveyLaunchDate"
    response: "SurveyDate"
  training_event_field: "TrainingDate"
  rules:
    - "Minden elemzési időszak vége legfeljebb 2026-06-30 lehet."
    - "A felmérési hullámok összehasonlításához a SurveyLaunchDate, a tényleges válasz időpontjához a SurveyDate használandó."
    - "A képzési esemény időpontját a TrainingDate határozza meg."
    - "A foglalkoztatási időszakot a StartDate és az ExitDate alapján kell meghatározni."

catalog_components:
  dataset_definitions:
    - "datasets/employee.yaml"
    - "datasets/engagement.yaml"
    - "datasets/training.yaml"
  metrics: "metrics.yaml"
  analysis_rules: "analysis_rules.yaml"
  business_rules: "business_rules.yaml"
  question_routing: "question_routing.yaml"
  glossary: "glossary.yaml"
