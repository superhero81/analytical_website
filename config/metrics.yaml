  - name: "TrainingParticipationRate"
    label: "Képzési részvételi arány"
    group: "training"

    description: >-
      Azon munkavállalók aránya, akik a vizsgált időszakban legalább egy
      nem törölt képzésen részt vettek.

    source_datasets:
      - "training"
      - "employee"

    required_fields:
      - dataset: "training"
        field: "EmpID"
        expected_type: "integer"
      - dataset: "training"
        field: "TrainingDate"
        expected_type: "date"
      - dataset: "training"
        field: "CompletionStatus"
        expected_type: "string"
      - dataset: "employee"
        field: "EmpID"
        expected_type: "integer"
      - dataset: "employee"
        field: "StartDate"
        expected_type: "date"
      - dataset: "employee"
        field: "ExitDate"
        expected_type: "date_or_null"

    formula: >-
      A period_start <= TrainingDate <= period_end és
      CompletionStatus != "Cancelled" feltételnek megfelelő egyedi EmpID-k
      száma / az időszakban legalább egy napon állományban lévő egyedi
      EmpID-k száma * 100.

    numerator: >-
      A vizsgált időszakban legalább egy Completed vagy Incomplete
      képzési rekorddal rendelkező egyedi munkavállalók száma.

    denominator: >-
      Azok az egyedi munkavállalók, akiknél StartDate <= period_end és
      ExitDate üres vagy ExitDate > period_start.

    unit: "százalék"
    default_for_analysis: true

    time_reference: >-
      A képzés TrainingDate mezőjének dátuma alapján meghatározott időszak,
      mindkét határnapot beleszámítva.

    organizational_filtering: >-
      A számlálót és a nevezőt ugyanarra a kiválasztott szervezeti vagy
      munkavállalói csoportra kell szűrni.

    missing_value_handling: >-
      Hiányzó TrainingDate vagy CompletionStatus esetén a képzési rekord
      kizárandó a számlálóból.

    minimum_group_size: 4

    allowed_uses:
      - "képzési lefedettség vizsgálata"
      - "idősoros elemzés"
      - "munkavállalói csoportok összehasonlítása"

    interpretation:
      result_type: "calculated_rate"
      higher_value_meaning: "A munkavállalók nagyobb része vett részt képzésen."
      lower_value_meaning: "A munkavállalók kisebb része vett részt képzésen."

    limitations:
      - "Egy munkavállaló több képzés esetén is csak egyszer szerepel a számlálóban."
      - "A Cancelled képzési rekordok nem számítanak részvételnek."
      - "A besorolás a képzés kezdőnapja alapján történik."

    rounding:
      decimals: 1

    causal_warning: >-
