metadata:
  file_name: "metrics.yaml"
  purpose: "Az AI által használható számított HR-mutatók definíciói."
  official_cutoff_date: "2026-06-30"

metric_groups:
  - id: "workforce"
    label: "Létszám és foglalkoztatás"

  - id: "turnover"
    label: "Fluktuáció"

  - id: "engagement"
    label: "Engagement és elégedettség"

  - id: "training"
    label: "Képzés és fejlesztés"


metrics:
  - name: "ClosingHeadcount"
    label: "Zárónapi létszám"
    group: "workforce"

    description: >-
      A referencia-időpontban állományban lévő munkavállalók száma.

    source_datasets:
      - "employee"

    required_fields:
      - dataset: "employee"
        field: "EmpID"
        expected_type: "integer"
      - dataset: "employee"
        field: "StartDate"
        expected_type: "date"
      - dataset: "employee"
        field: "ExitDate"
        expected_type: "date_or_null"
 
    formula: >-
      COUNT(DISTINCT EmpID), ahol StartDate <= reference_date és
      (ExitDate üres vagy ExitDate > reference_date).

    numerator: "A referencia-időpontban állományban lévő egyedi munkavállalók száma."
    denominator: null
    unit: "fő"

    time_reference: >-
      Alapértelmezett referencia-időpont: 2026-06-30.
      Más dátum csak az adatállomány időbeli lefedettségén belül használható.

    organizational_filtering: >-
      A létszám az employee adatállomány használható szervezeti és
      munkavállalói jellemzői szerint szűrhető.

    missing_value_handling: >-
      A hiányzó ExitDate azt jelenti, hogy a munkavállaló a referencia-időpontig
      nem lépett ki. Hiányzó EmpID vagy StartDate esetén a rekord nem számítható be.

    minimum_group_size: 4

    allowed_uses:
      - "teljes vállalati létszám meghatározása"
      - "csoportok létszámának összehasonlítása"
      - "időbeli létszámváltozás vizsgálata"

    interpretation:
      result_type: "calculated_result"
      higher_value_meaning: "Nagyobb állományi létszám."
      lower_value_meaning: "Kisebb állományi létszám."

    limitations:
      - >-
        A történeti szervezeti bontás a jelenlegi employee-jellemzőket használja,
        mert szervezeti változástörténet nem áll rendelkezésre.
      - "A mutató személyeket számol, nem teljes munkaidős egyenértéket (FTE)."

    causal_warning: >-
      A létszám változása önmagában nem mutatja meg annak okát.

    documentation_status: "confirmed"


  - name: "OpeningHeadcount"
    label: "Nyitónapi létszám"
    group: "workforce"

    description: >-
      A vizsgált időszak első napján állományban lévő munkavállalók száma.

    source_datasets:
      - "employee"

    required_fields:
      - dataset: "employee"
        field: "EmpID"
        expected_type: "integer"
      - dataset: "employee"
        field: "StartDate"
        expected_type: "date"
      - dataset: "employee"
        field: "ExitDate"
        expected_type: "date_or_null"

    formula: >-
      COUNT(DISTINCT EmpID), ahol StartDate <= period_start és
      (ExitDate üres vagy ExitDate > period_start).

    numerator: >-
      A vizsgált időszak első napján állományban lévő egyedi munkavállalók száma.

    denominator: "Nincs."
    unit: "fő"

    time_reference: >-
      A felhasználó által megadott időszak első napja. Előre definiált napi,
      havi vagy éves időszak, illetve tetszőleges kezdő- és záródátum is
      használható.

    organizational_filtering: >-
      A szám mutató a kiválasztott szervezeti vagy munkavállalói csoportra
      szűrve is kiszámítható.

    missing_value_handling: >-
      Hiányzó StartDate esetén a rekord kizárandó. A hiányzó ExitDate azt
      jelenti, hogy a munkavállaló az adatállomány záródátumáig nem lépett ki.

    minimum_group_size: 4

    allowed_uses:
      - "napi, havi és éves létszámelemzés"
      - "idősoros elemzés"
      - "csoportok összehasonlítása"
      - "fluktuációs mutatók számítása"

    interpretation:
      result_type: "calculated_result"
      higher_value_meaning: "Nagyobb időszak eleji létszám."
      lower_value_meaning: "Kisebb időszak eleji létszám."

    limitations:
      - "A mutató létszámot, nem teljes munkaidős egyenértéket mér."
      - "Az időszak első napján kilépő munkavállaló már nem számít állományban lévőnek."

    causal_warning: >-
      A létszám nagysága vagy változása önmagában nem mutatja meg annak okát.

    documentation_status: "confirmed"

  - name: "AverageHeadcount"
    label: "Napi átlagos létszám"
    group: "workforce"

    description: >-
      A vizsgált időszak minden naptári napjára kiszámított
      állományi létszám számtani átlaga.

    source_datasets:
      - "employee"

    required_fields:
      - dataset: "employee"
        field: "EmpID"
        expected_type: "integer"
      - dataset: "employee"
        field: "StartDate"
        expected_type: "date"
      - dataset: "employee"
        field: "ExitDate"
        expected_type: "date_or_null"

    formula: >-
      Minden naptári napra COUNT(DISTINCT EmpID), ahol StartDate <= day
      és (ExitDate üres vagy ExitDate > day), majd a napi létszámok
      összege / a vizsgált időszak naptári napjainak száma.

    numerator: "A vizsgált időszak napi létszámainak összege."
    denominator: "A vizsgált időszak naptári napjainak száma."
    unit: "fő"

    time_reference: >-
      A felhasználó által megadott teljes időszak, mindkét határnapot
      beleszámítva. Előre definiált vagy tetszőleges időszak is használható.

    organizational_filtering: >-
      A számlálást minden napon ugyanarra a kiválasztott szerevezeti vagy
      munkavállalói csoportra kell szűrni.

    missing_value_handling: >-
      Hiányzó StartDate esetén a rekord kizárandó. A hiányzó ExitDate azt
      jelenti, hogy a munkavállaló az adatállomány záródátumáig nem lépett ki.

    minimum_group_size: 4

    allowed_uses:
      - "időszaki átlagos létszám"
      - "idősoros létszámelemzés"
      - "csoportok összehasonlítása"
      - "fluktuációs mutatók nevezője"

    interpretation:
      result_type: "calculated_result"
      higher_value_meaning: "Nagyobb átlagos állományi létszám."
      lower_value_meaning: "Kisebb átlagos állományi létszám."

    limitations:
      - "A mutató létszámot, nem teljes munkaidős egyenértéket mér."
      - "A kilépés napján a munkavállaló már nem számít állományban lévőnek."

    causal_warning: >-
      Az átlagos létszám változása önmagában nem mutatja meg a változás okát.

    method_selection_rule: >-
      Ez az alapértelmezett átlagos létszámmutató. Az AI a napi
      létszámok átlagát használja, ha a felhasználó nem kér más módszert.

    rounding:
      decimals: 1

    documentation_status: "confirmed"


  - name: "OpeningClosingAverageHeadcount"
    label: "Nyitó- és zárólétszám átlaga"
    group: "workforce"

    description: >-
      A vizsgált időszak nyitó- és zárólétszámának számtani átlaga.

    required_metrics:
      - "OpeningHeadcount"
      - "ClosingHeadcount"

    numerator: "A nyitó- és zárólétszám összege."
    denominator: "2"

    formula: "(OpeningHeadcount + ClosingHeadcount) / 2"
    unit: "fő"

    usage: >- 
      Önálló, egyszerűsített létszámmutató. Csak a felhasználó
      kifejezett kérésére használható, vagy az AverageHeadcount
      kiegészítő összehasonlításaként ajánlható fel, különösen akkor,
      ha a két mutató közötti eltérés jelentős. Az AverageHeadcount
      helyettesítésére nem használható.

    limitations:
      - "Nem veszi figyelembe azokat a létszámváltozásokat, amelyek az időszak 
        két határnapja között történtek, de a zárólétszámra már nem voltak hatással."

    ai_rule: >-
      Nem helyettesítheti az AverageHeadcount mutatót, és
      fluktuációs mutató nevezőjeként alapértelmezetten nem használható.

    time_reference: >-
      A felhasználó által megadott időszak első és utolsó napja.

    organizational_filtering: >-
      A nyitó- és zárólétszámot ugyanarra a kiválasztott szervezeti vagy
      munkavállalói csoportra kell kiszámítani.

    minimum_group_size: 4

    significant_difference_rule: >-
      Az AverageHeadcount értékétől való eltérés akkor jelentős, ha
      abszolút relatív mértéke legalább 2 százalék.

    allowed_uses:
      - "egyszerűsített átlagos létszám kifejezett kérésre"
      - "összehasonlítás a napi átlagos létszámmal"

    rounding:
      decimals: 1

    documentation_status: "confirmed"

  - name: "HireCount"
    label: "Belépők száma"
    group: "workforce"

    description: >-
      A vizsgált időszakban állományba lépett munkavállalók száma.

    source_datasets:
      - "employee"

    required_fields:
      - dataset: "employee"
        field: "EmpID"
        expected_type: "integer"
      - dataset: "employee"
        field: "StartDate"
        expected_type: "date"

    formula: >-
      COUNT(DISTINCT EmpID), ahol period_start <= StartDate <= period_end.

    numerator: "A vizsgált időszakban belépett egyedi munkavállalók száma."
    denominator: "Nincs."
    unit: "fő"

    time_reference: >-
      A felhasználó által megadott teljes időszak, mindkét határnapot
      beleszámítva.

    organizational_filtering: >-
      A mutató a kiválasztott szervezeti vagy munkavállalói csoportra
      szűrve is kiszámítható.

    missing_value_handling: >-
      Hiányzó StartDate esetén a rekord nem sorolható időszakhoz,
      ezért kizárandó.

    minimum_group_size: 4

    allowed_uses:
      - "létszámváltozás elemzése"
      - "idősoros elemzés"
      - "csoportok összehasonlítása"

    interpretation:
      result_type: "calculated_result"
      higher_value_meaning: "Több belépő az adott időszakban."
      lower_value_meaning: "Kevesebb belépő az adott időszakban."

    limitations:
      - "Az adatállomány munkavállalónként egy StartDate értéket tartalmaz."
      - "Az esetleges újrafelvételek külön eseményként nem vizsgálhatók."

    causal_warning: >-
      A belépők számából önmagában nem állapítható meg a változás oka.

    documentation_status: "confirmed"

  - name: "ExitCount"
    label: "Kilépők száma"
    group: "workforce"

    description: >-
      A vizsgált időszakban kilépett munkavállalók száma, a kilépés
      okától vagy típusától függetlenül.

    source_datasets:
      - "employee"

    required_fields:
      - dataset: "employee"
        field: "EmpID"
        expected_type: "integer"
      - dataset: "employee"
        field: "ExitDate"
        expected_type: "date_or_null"

    formula: >-
      COUNT(DISTINCT EmpID), ahol period_start <= ExitDate <= period_end.

    numerator: "A vizsgált időszakban kilépett egyedi munkavállalók száma."
    denominator: "Nincs."
    unit: "fő"

    time_reference: >-
      A felhasználó által megadott teljes időszak, mindkét határnapot
      beleszámítva.

    organizational_filtering: >-
      A mutató a kiválasztott szervezeti vagy munkavállalói csoportra
      szűrve is kiszámítható.

    missing_value_handling: >-
      A hiányzó ExitDate azt jelenti, hogy a munkavállaló az adatállomány
      záródátumáig nem lépett ki, ezért nem számít bele.

    minimum_group_size: 4

    allowed_uses:
      - "létszámváltozás elemzése"
      - "idősoros elemzés"
      - "csoportok összehasonlítása"
      - "fluktuációs mutatók számlálója"

    interpretation:
      result_type: "calculated_result"
      higher_value_meaning: "Több kilépő az adott időszakban."
      lower_value_meaning: "Kevesebb kilépő az adott időszakban."

    limitations:
      - "A mutató minden kilépést tartalmaz, a nyugdíjazást is."
      - "Az adatállomány az esetleges ismételt munkaviszonyokat nem kezeli külön."

    causal_warning: >-
      A kilépők számából önmagában nem állapítható meg a kilépések oka.

    documentation_status: "confirmed"

  - name: "TotalTurnoverRate"
    label: "Teljes fluktuációs ráta"
    group: "turnover"

    description: >-
      A vizsgált időszakban kilépett munkavállalók aránya az időszak
      napi átlagos létszámához viszonyítva. A nyugdíjazásokat is tartalmazza.

    required_metrics:
      - "ExitCount"
      - "AverageHeadcount"

    formula: "(ExitCount / AverageHeadcount) * 100"

    numerator: >-
      A vizsgált időszak összes kilépője, beleértve a Voluntarily Terminated,
      Terminated for Cause és Retired státuszú munkavállalókat.

    denominator: "A vizsgált időszak napi átlagos létszáma."
    unit: "százalék"

    time_reference: >-
      A felhasználó által megadott teljes időszak, mindkét határnapot
      beleszámítva. A mutató nincs automatikusan évesítve.

    organizational_filtering: >-
      A számlálót és a nevezőt ugyanarra a kiválasztott szervezeti vagy
      munkavállalói csoportra kell kiszámítani.

    zero_denominator_handling: >-
      Nulla átlagos létszám esetén a mutató nem számítható ki.

    minimum_group_size: 4

    allowed_uses:
      - "időszakos fluktuáció elemzése"
      - "idősoros elemzés"
      - "csoportok összehasonlítása"

    interpretation:
      result_type: "calculated_result"
      higher_value_meaning: "Nagyobb teljes kilépési arány."
      lower_value_meaning: "Kisebb teljes kilépési arány."

    limitations:
      - "A mutató a nyugdíjazásokat is tartalmazza."
      - "Eltérő hosszúságú időszakok közvetlenül nem hasonlíthatók össze."
      - "A mutató nem különbözteti meg a kilépés típusait."

    rounding:
      decimals: 1

    causal_warning: >-
      A fluktuációs ráta önmagában nem magyarázza meg a kilépések okát.

    documentation_status: "confirmed"

  - name: "VoluntaryTurnoverRate"
    label: "Önkéntes fluktuációs ráta"
    group: "turnover"

    description: >-
      Az önkéntesen kilépett munkavállalók aránya a vizsgált időszak
      napi átlagos létszámához viszonyítva.

    source_datasets:
      - "employee"

    required_fields:
      - dataset: "employee"
        field: "EmpID"
        expected_type: "integer"
      - dataset: "employee"
        field: "ExitDate"
        expected_type: "date_or_null"
      - dataset: "employee"
        field: "EmployeeStatus"
        expected_type: "string"

    required_metrics:
      - "AverageHeadcount"

    formula: >-
      A period_start <= ExitDate <= period_end és
      EmployeeStatus = "Voluntarily Terminated" feltételnek megfelelő
      egyedi munkavállalók száma / AverageHeadcount * 100.

    numerator: "A vizsgált időszakban önkéntesen kilépett munkavállalók száma."
    denominator: "A vizsgált időszak napi átlagos létszáma."
    unit: "százalék"

    time_reference: >-
      A felhasználó által megadott teljes időszak, mindkét határnapot
      beleszámítva. A mutató nincs automatikusan évesítve.

    organizational_filtering: >-
      A számlálót és a nevezőt ugyanarra a kiválasztott szervezeti vagy
      munkavállalói csoportra kell kiszámítani.

    zero_denominator_handling: >-
      Nulla átlagos létszám esetén a mutató nem számítható ki.

    minimum_group_size: 4

    allowed_uses:
      - "önkéntes fluktuáció elemzése"
      - "idősoros elemzés"
      - "csoportok összehasonlítása"

    interpretation:
      result_type: "calculated_result"
      higher_value_meaning: "Nagyobb önkéntes kilépési arány."
      lower_value_meaning: "Kisebb önkéntes kilépési arány."

    limitations:
      - "A nyugdíjazás és a munkáltató által kezdeményezett kilépés nem tartozik ide."
      - "Eltérő hosszúságú időszakok közvetlenül nem hasonlíthatók össze."

    rounding:
      decimals: 1

    causal_warning: >-
      Az önkéntes fluktuációs ráta önmagában nem magyarázza meg a kilépések okát.

    documentation_status: "confirmed"

  - name: "InvoluntaryTurnoverRate"
    label: "Nem önkéntes fluktuációs ráta"
    group: "turnover"

    description: >-
      A munkáltató által megszüntetett munkaviszonyok aránya a vizsgált
      időszak napi átlagos létszámához viszonyítva.

    source_datasets:
      - "employee"

    required_fields:
      - dataset: "employee"
        field: "EmpID"
        expected_type: "integer"
      - dataset: "employee"
        field: "ExitDate"
        expected_type: "date_or_null"
      - dataset: "employee"
        field: "EmployeeStatus"
        expected_type: "string"

    required_metrics:
      - "AverageHeadcount"

    formula: >-
      A period_start <= ExitDate <= period_end és
      EmployeeStatus = "Terminated for Cause" feltételnek megfelelő
      egyedi munkavállalók száma / AverageHeadcount * 100.

    numerator: >-
      A vizsgált időszakban Terminated for Cause státusszal kilépett
      munkavállalók száma.
    denominator: "A vizsgált időszak napi átlagos létszáma."
    unit: "százalék"

    time_reference: >-
      A felhasználó által megadott teljes időszak, mindkét határnapot
      beleszámítva. A mutató nincs automatikusan évesítve.

    organizational_filtering: >-
      A számlálót és a nevezőt ugyanarra a kiválasztott szervezeti vagy
      munkavállalói csoportra kell kiszámítani.

    zero_denominator_handling: >-
      Nulla átlagos létszám esetén a mutató nem számítható ki.

    minimum_group_size: 4

    allowed_uses:
      - "nem önkéntes fluktuáció elemzése"
      - "idősoros elemzés"
      - "csoportok összehasonlítása"

    interpretation:
      result_type: "calculated_result"
      higher_value_meaning: "Nagyobb munkáltatói megszüntetési arány."
      lower_value_meaning: "Kisebb munkáltatói megszüntetési arány."

    query_aliases:
      - "elbocsátás"
      - "elbocsájtás"
      - "kirúgás"
      - "elküldés"
      - "munkáltatói felmondás"

    ambiguous_terms:
      leépítés: >-
        A kifejezés a nem önkéntes kilépésekhez irányítható, de az adatállományból
        nem állapítható meg, hogy a megszüntetés ténylegesen létszámleépítés miatt történt-e.

    limitations:
      - "A mutató kizárólag a Terminated for Cause státuszú kilépéseket tartalmazza."
      - "A nyugdíjazás és az önkéntes kilépés nem tartozik ide."
      - "Eltérő hosszúságú időszakok közvetlenül nem hasonlíthatók össze."
      - "A közös megegyezéssel történő munkaviszony-megszűnés nincs külön rögzítve."

    unavailable_exit_categories:
      - name: "Mutual Agreement"
        label: "Közös megegyezés"
        handling: >-
          A közös megegyezést bármelyik fél kezdeményezheti, ezért az
          önkéntes vagy nem önkéntes besorolás csak a kezdeményező fél
          külön rögzítése alapján lenne lehetséges. Az adatállomány ezt
          nem tartalmazza, ezért a kategória nem elemezhető és nem
          sorolható automatikusan egyik fluktuációtípushoz sem.

    rounding:
      decimals: 1

    causal_warning: >-
      A mutató önmagában nem magyarázza meg a munkaviszonyok megszüntetésének okát.

    documentation_status: "confirmed"

  - name: "RetirementExitRate"
    label: "Nyugdíjazási kilépési ráta"
    group: "turnover"

    description: >-
      A nyugdíjazással kilépett munkavállalók aránya a vizsgált időszak
      napi átlagos létszámához viszonyítva.

    source_datasets:
      - "employee"

    required_fields:
      - dataset: "employee"
        field: "EmpID"
        expected_type: "integer"
      - dataset: "employee"
        field: "ExitDate"
        expected_type: "date_or_null"
      - dataset: "employee"
        field: "EmployeeStatus"
        expected_type: "string"

    required_metrics:
      - "AverageHeadcount"

    formula: >-
      A period_start <= ExitDate <= period_end és EmployeeStatus = "Retired"
      feltételnek megfelelő egyedi munkavállalók száma /
      AverageHeadcount * 100.

    numerator: >-
      A vizsgált időszakban Retired státusszal kilépett munkavállalók száma.

