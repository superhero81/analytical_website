    minimum_unique_employee_count: 4

    accompanying_values:
      - "érvényes válaszrekordok száma"
      - "egyedi válaszadó munkavállalók száma"
      - "összevont felmérési hullámok száma"

    limitations:
      - "A nagyobb válaszadószámú hullámok nagyobb súlyt kapnak."
      - "Egy munkavállaló több válaszrekorddal is szerepelhet."
      - "Az összevont érték elfedheti a hullámok közötti változásokat."
      - "Az egyes hullámok eredményeit kérésre külön is be kell mutatni."

