        field: "EngagementScore"
        expected_type: "integer"

    formula: >-
      A kiválasztott hullámok minden érvényes EngagementScore értékét
      (EngagementScore - 1) * 25 képlettel 0–100-as skálára kell
      átalakítani, majd a válaszrekordok számtani átlagát kell venni.

    unit: "indexpont a 0–100-as skálán"

    pooling_method: "response_record_weighted"

    weighting_rule: >-
      Minden válaszrekord azonos súlyt kap. Az a munkavállaló, aki több
      kiválasztott hullámban válaszolt, minden válaszával külön szerepel.

    default_for_general_analysis: false
    default_for_matching_query: true

    usage_rule: >-
      Csak akkor használható, ha a felhasználó több hullám összevont,
      együttes vagy pooled elkötelezettségi eredményét kéri.

    time_reference: "A felhasználó által kiválasztott felmérési hullámok."

    missing_value_handling: >-
