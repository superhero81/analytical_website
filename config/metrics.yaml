      A félbehagyott képzési rekordok aránya a megkezdett,
      nem törölt képzések között.

    source_datasets:
      - "training"

    required_fields:
      - dataset: "training"
        field: "TrainingRecordID"
        expected_type: "string"
      - dataset: "training"
        field: "TrainingDate"
        expected_type: "date"
      - dataset: "training"
        field: "CompletionStatus"
        expected_type: "string"

    formula: >-
      COUNT(CompletionStatus = "Incomplete") /
      COUNT(CompletionStatus IN ["Completed", "Incomplete"]) * 100.

    numerator: "Az Incomplete státuszú képzési rekordok száma."
    denominator: >-
      A Completed vagy Incomplete státuszú képzési rekordok száma.
      A Cancelled rekordok nem szerepelnek a nevezőben.

    unit: "százalék"

    time_reference: >-
      Azok a képzési rekordok tartoznak az időszakhoz, amelyeknél
      period_start <= TrainingDate <= period_end.

    missing_value_handling: >-
      Hiányzó TrainingDate vagy CompletionStatus esetén a rekord
      kimarad a számlálóból és a nevezőből.

    minimum_group_size: 4

    allowed_uses:
      - "félbehagyott képzések arányának vizsgálata"
      - "idősoros elemzés"
      - "képzési programok és munkavállalói csoportok összehasonlítása"

    interpretation:
      result_type: "calculated_rate"
      higher_value_meaning: "A megkezdett képzések nagyobb része maradt befejezetlen."
      lower_value_meaning: "A megkezdett képzések kisebb része maradt befejezetlen."

    relationship_to_other_metrics: >-
      Azonos szűrés és érvényes adatok mellett a TrainingCompletionRate
      és a TrainingIncompleteRate összege 100%, a kerekítési eltéréstől eltekintve.

    limitations:
