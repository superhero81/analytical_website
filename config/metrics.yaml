      fluktuációs rátája, a nyugdíjazásokat is beleértve.

    required_metrics:
      - "ExitCount"
      - "AverageHeadcount"

    formula: >-
      A gördülő háromhavi időszak ExitCount értéke /
      ugyanezen időszak AverageHeadcount értéke * 100.

    numerator: >-
      A gördülő háromhavi időszak összes kilépője, beleértve a
      Voluntarily Terminated, Terminated for Cause és Retired státuszokat.

