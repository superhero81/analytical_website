  - name: "CostPerParticipant"
    label: "Egy résztvevőre jutó képzési költség"
    group: "training"

    description: >-
      A vizsgált időszak nem törölt képzéseinek összes költsége az
      egyedi képzési résztvevők számához viszonyítva.

    source_datasets:
      - "training"

    required_fields:
      - dataset: "training"
        field: "EmpID"
        expected_type: "integer"
      - dataset: "training"
        field: "TrainingDate"
        expected_type: "date"
      - dataset: "training"
        field: "TrainingCostUSD"
        expected_type: "number"
      - dataset: "training"
        field: "CompletionStatus"
        expected_type: "string"

    formula: >-
      A period_start <= TrainingDate <= period_end és
      CompletionStatus != "Cancelled" feltételnek megfelelő TrainingCostUSD
      értékek összege / az ugyanezen rekordokban szereplő egyedi EmpID-k száma.

    numerator: "A nem törölt képzési rekordok TrainingCostUSD értékeinek összege."
    denominator: "A nem törölt képzéseken részt vevő egyedi munkavállalók száma."
    unit: "USD/fő"

    default_for_analysis: true

    time_reference: >-
      A képzési költségek a TrainingDate alapján kerülnek a vizsgált időszakba.

    organizational_filtering: >-
      A számlálót és a nevezőt ugyanarra a képzési, szervezeti vagy
      munkavállalói csoportra kell szűrni.

    missing_value_handling: >-
      Hiányzó TrainingDate, TrainingCostUSD vagy CompletionStatus esetén
      a rekord kizárandó és adatminőségi hibaként jelzendő.

    zero_denominator_handling: >-
      Résztvevő nélküli csoportnál a mutató nem számítható ki.

    minimum_unique_employee_count: 4

    allowed_uses:
      - "képzési költséghatékonyság elemzése"
      - "képzési programok és szolgáltatók összehasonlítása"
      - "szervezeti és munkavállalói csoportok összehasonlítása"

    interpretation:
      result_type: "calculated_cost"
      higher_value_meaning: "Magasabb egy résztvevőre jutó képzési költség."
      lower_value_meaning: "Alacsonyabb egy résztvevőre jutó képzési költség."

    limitations:
      - "Egy résztvevő több képzésének költsége összeadódik."
      - "A mutató nem azonos az egy képzési rekordra jutó átlagköltséggel."
      - "A Cancelled képzések költsége nem szerepel a számításban."

    rounding:
