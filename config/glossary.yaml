metadata:
  file_name: "glossary.yaml"
  purpose: >-
    A projektben használt HR-, képzési és statisztikai fogalmak,
    elnevezések és szinonimák egységes értelmezése.
  language: "hu"
  official_cutoff_date: "2026-06-30"

source_catalogs:
  - "employee.yaml"
  - "engagement.yaml"
  - "training.yaml"
  - "metrics.yaml"
  - "business_rules.yaml"
  - "analysis_rules.yaml"
  - "question_routing.yaml"

term_groups:
  - id: "workforce"
    label: "Létszám és foglalkoztatás"

  - id: "turnover"
    label: "Fluktuáció és kilépés"

  - id: "engagement"
    label: "Engagement és felmérések"

  - id: "training"
    label: "Képzés és fejlesztés"

  - id: "statistics"
    label: "Statisztikai fogalmak"

  - id: "privacy"
    label: "Adatvédelem és eredményközlés"

terms:

  - id: "headcount"
    preferred_term: "létszám"
    group: "workforce"

    synonyms:
      - "állományi létszám"
      - "dolgozói létszám"
      - "munkavállalók száma"
      - "hány dolgozó"
      - "hány munkavállaló"

    definition: >-
      Egy meghatározott időpontban vagy időszakban állományban lévő
      munkavállalók száma.

    related_fields:
      - "EmpID"
      - "StartDate"
      - "ExitDate"

    related_metrics:
      - "OpeningHeadcount"
      - "ClosingHeadcount"
      - "AverageHeadcount"
      - "OpeningClosingAverageHeadcount"

    interpretation_rule: >-
      A „létszám” pontos jelentését az időbeli megfogalmazás határozza meg.
      Ha ez nem egyértelmű, tisztázni kell, hogy nyitó-, záró- vagy
      átlagos létszámról van-e szó.

    documentation_status: "confirmed"

  - id: "average_headcount"
    preferred_term: "átlagos létszám"
    group: "workforce"

    synonyms:
      - "időszaki átlaglétszám"
      - "átlaglétszám"
      - "napi átlagos állományi létszám"

    definition: >-
      A vizsgált időszak egyes naptári napjaira kiszámított
      állományi létszámok számtani átlaga.

    default_metric: "AverageHeadcount"

    alternative_metric:
      name: "OpeningClosingAverageHeadcount"
      meaning: "A nyitó- és zárólétszám egyszerű számtani átlaga."
      usage: "Csak kifejezett kérésre vagy kiegészítő összehasonlításként."

    interpretation_rule: >-
      Az „átlagos létszám” alapértelmezetten napi átlagos létszámot jelent.
      A nyitó- és zárólétszám átlaga nem használható automatikusan helyette.

    documentation_status: "confirmed"

  - id: "active_employee"
    preferred_term: "állományban lévő munkavállaló"
    group: "workforce"

    synonyms:
      - "aktív munkavállaló"
      - "foglalkoztatott"
      - "állományban lévő dolgozó"
      - "munkaviszonyban álló munkavállaló"

    definition: >-
      Az adott napon olyan munkavállaló, akinél StartDate legfeljebb
      az adott nap, és ExitDate nincs kitöltve vagy későbbi az adott napnál.

    calculation_rule: >-
      StartDate <= reference_date és
      (ExitDate üres vagy ExitDate > reference_date).

    boundary_rules:
      - "A belépés napján már állományban lévőnek számít."
      - "A kilépés napján már nem számít állományban lévőnek."
      - "A Leave of Absence státuszú munkavállaló munkaviszonya fennáll."

    related_rule: "active_employment_on_date"

    documentation_status: "confirmed"

  - id: "hire"
    preferred_term: "belépő"
    group: "workforce"

    synonyms:
      - "új belépő"
      - "új munkavállaló"
      - "felvett dolgozó"
      - "munkaerő-felvétel"
      - "belépés"

    definition: >-
      Olyan munkavállaló, akinek StartDate értéke a vizsgált
      időszakba esik.

    related_field: "StartDate"
    related_metric: "HireCount"

    interpretation_rule: >-
      A belépők számát a StartDate, nem pedig az EmployeeStatus
      értéke alapján kell meghatározni.

    documentation_status: "confirmed"

  - id: "exit"
    preferred_term: "kilépő"
    group: "turnover"

    synonyms:
      - "kilépés"
      - "távozó munkavállaló"
      - "megszűnt munkaviszony"
      - "állományból kikerült munkavállaló"

    definition: >-
      Olyan munkavállaló, akinek kitöltött ExitDate értéke
      a vizsgált időszakba esik.

    related_fields:
      - "ExitDate"
      - "EmployeeStatus"

    related_metric: "ExitCount"

    interpretation_rule: >-
      A kilépés időpontját az ExitDate határozza meg.
      A kilépés napján a munkavállaló már nem számít állományban lévőnek.

    documentation_status: "confirmed"

  - id: "turnover"
    preferred_term: "fluktuáció"
    group: "turnover"

    synonyms:
      - "kilépési arány"
      - "munkaerő-forgalom"
      - "turnover"
      - "employee turnover"
      - "attrition"

    definition: >-
      A vizsgált időszak kilépőinek száma a napi átlagos
      létszámhoz viszonyítva, százalékban.

    default_metric: "TotalTurnoverRate"

    related_metrics:
      - "VoluntaryTurnoverRate"
      - "InvoluntaryTurnoverRate"
      - "RetirementExitRate"
      - "Rolling3MonthTurnoverRate"
      - "Rolling12MonthTurnoverRate"

    interpretation_rule: >-
      Típus megadása nélkül a fluktuáció a teljes fluktuációt jelenti,
      amely az önkéntes, nem önkéntes és nyugdíjazási kilépéseket is tartalmazza.

    documentation_status: "confirmed"

  - id: "voluntary_turnover"
    preferred_term: "önkéntes fluktuáció"
    group: "turnover"

    synonyms:
      - "önkéntes kilépési arány"
      - "saját döntésből távozók aránya"
      - "felmondók aránya"
      - "voluntary turnover"
      - "voluntary attrition"

    definition: >-
      A Voluntarily Terminated státuszú kilépők száma a vizsgált
      időszak napi átlagos létszámához viszonyítva.

    status_value: "Voluntarily Terminated"
    related_metric: "VoluntaryTurnoverRate"

    restriction: >-
      A közös megegyezés nem sorolható automatikusan az önkéntes
      fluktuációhoz, és az adatállományban külön nem azonosítható.

    documentation_status: "confirmed"

  - id: "involuntary_turnover"
    preferred_term: "nem önkéntes fluktuáció"
    group: "turnover"

    synonyms:
      - "nem önkéntes kilépési arány"
      - "munkáltatói megszüntetés"
      - "elbocsátás"
      - "elbocsájtás"
      - "kirúgás"
      - "leépítés"
      - "elküldés"
      - "involuntary turnover"
      - "involuntary attrition"

    definition: >-
      A Terminated for Cause státuszú kilépők száma a vizsgált
      időszak napi átlagos létszámához viszonyítva.

    status_value: "Terminated for Cause"
    related_metric: "InvoluntaryTurnoverRate"

    restriction: >-
      A felsorolt hétköznapi kifejezések a kérdések értelmezését segítik,
      de az adatállomány nem tartalmazza a munkaviszony megszüntetésének
      részletes okát. A közös megegyezés nem sorolható automatikusan
      a nem önkéntes fluktuációhoz.

    documentation_status: "confirmed"

  - id: "retirement_exit"
    preferred_term: "nyugdíjazási kilépés"
    group: "turnover"

    synonyms:
      - "nyugdíjba vonulás"
      - "nyugdíjazás"
      - "nyugdíjazási kilépési ráta"
      - "retirement"
      - "retirement exit"

    definition: >-
      A Retired státusszal rögzített kilépés. A nyugdíjazási kilépési
      ráta az ilyen kilépők számát viszonyítja az időszak napi átlagos
      létszámához.

    status_value: "Retired"
    related_metric: "RetirementExitRate"

    restriction: >-
      A nyugdíjazás része a teljes fluktuációnak, de nem tartozik sem
      az önkéntes, sem a nem önkéntes fluktuációhoz.

    documentation_status: "confirmed"


  - id: "mutual_agreement"
    preferred_term: "közös megegyezés"
    group: "turnover"

    synonyms:
      - "közös megegyezéssel történő kilépés"
      - "közös megegyezéssel történő megszüntetés"
      - "mutual agreement"
      - "termination by mutual agreement"

    definition: >-
      A munkaviszony olyan megszüntetési módja, amelyet bármelyik fél
      kezdeményezhet, majd a munkáltató és a munkavállaló megállapodással
      zár le.

    available_in_data: false
    related_metric: null

    restriction: >-
      Az adatállományban nincs külön közös megegyezés kategória.
      Ezért nem elemezhető, és nem sorolható automatikusan sem az
      önkéntes, sem a nem önkéntes fluktuációhoz.

    documentation_status: "confirmed"


  - id: "rolling_turnover"
    preferred_term: "gördülő fluktuáció"
    group: "turnover"

    synonyms:
      - "gördülő fluktuációs ráta"
      - "rolling turnover"
      - "rolling attrition"
      - "mozgó időszaki fluktuáció"

    definition: >-
      Egy adott referencia-dátummal végződő, folyamatosan elmozduló
      időszak teljes fluktuációs rátája. A számláló az időszak kilépőinek
      száma, a nevező az időszak napi átlagos létszáma.

    related_metrics:
      - "Rolling3MonthTurnoverRate"
      - "Rolling12MonthTurnoverRate"

    interpretation_rule: >-
      A gördülő 3 havi mutató gyorsabban jelzi a rövid távú változásokat,
      míg a gördülő 12 havi mutató kiegyenlítettebb trendet mutat.

    restriction: >-
      Az egymást követő gördülő időszakok nagyrészt átfedik egymást,
      ezért az értékeik nem tekinthetők független megfigyeléseknek.

    documentation_status: "confirmed"

  - id: "engagement"
    preferred_term: "munkavállalói elkötelezettség"
    group: "engagement"

    synonyms:
      - "elkötelezettség"
      - "engagement"
      - "employee engagement"

    definition: >-
      A munkavállaló önbevalláson alapuló elkötelezettsége a vállalat
      és annak céljai iránt, egy 1–5-ös kérdéssel mérve.

    source_field: "EngagementScore"
    related_metrics:
      - "AverageEngagementScore"
      - "AverageEngagementIndex"

    default_metric: "AverageEngagementIndex"

    restriction: >-
      Nem több kérdésből képzett összetett mutató. Elemzéshez
      alapértelmezetten a 0–100-as indexet kell használni.

    documentation_status: "confirmed"


  - id: "satisfaction"
    preferred_term: "munkahelyi elégedettség"
    group: "engagement"

    synonyms:
      - "elégedettség"
      - "munkavállalói elégedettség"
      - "satisfaction"
      - "employee satisfaction"

    definition: >-
      A munkavállaló vállalattal mint munkahellyel kapcsolatos
      általános elégedettsége, egy 1–5-ös kérdéssel mérve.

    source_field: "SatisfactionScore"
    related_metrics:
      - "AverageSatisfactionScore"
      - "AverageSatisfactionIndex"

    default_metric: "AverageSatisfactionIndex"

    restriction: >-
      Nem több kérdésből képzett elégedettségi index. Elemzéshez
      alapértelmezetten a 0–100-as indexet kell használni.

    documentation_status: "confirmed"


  - id: "work_life_balance"
    preferred_term: "munka–magánélet egyensúlya"
    group: "engagement"

    synonyms:
      - "munka-magánélet egyensúly"
      - "work-life balance"
      - "work life balance"
      - "WLB"

    definition: >-
      Annak önbevalláson alapuló megítélése, hogy a munkavállalónak
      a munkája mellett elegendő ideje és energiája jut-e a magánéletére.

    source_field: "WorkLifeBalanceScore"
    related_metrics:
      - "AverageWorkLifeBalanceScore"
      - "AverageWorkLifeBalanceIndex"

    default_metric: "AverageWorkLifeBalanceIndex"

    restriction: >-
      Az alacsony érték lehetséges kockázati jelzés, de önmagában
      nem bizonyítja a kiégést. Elemzéshez alapértelmezetten a
      0–100-as indexet kell használni.

    documentation_status: "confirmed"

  - id: "average_survey_score"
    preferred_term: "átlagpontszám"
    group: "engagement"

    synonyms:
      - "átlagos pontszám"
      - "1–5-ös átlag"
      - "mean score"
      - "average score"

    definition: >-
      Az adott felmérési kérdés érvényes, 1–5 közötti válaszainak
      számtani átlaga.

    related_metrics:
      - "AverageEngagementScore"
      - "AverageSatisfactionScore"
      - "AverageWorkLifeBalanceScore"

    default_for_analysis: false

    usage_rule: >-
      Elemzéshez csak akkor használandó, ha a felhasználó kifejezetten
      az 1–5-ös skálán mért átlagpontszámot kéri.

    documentation_status: "confirmed"


  - id: "survey_index"
    preferred_term: "0–100-as felmérési index"
    group: "engagement"

    synonyms:
      - "index"
      - "0–100-as pontszám"
      - "survey index"

    definition: >-
      Az 1–5-ös átlagpontszám 0–100-as skálára történő lineáris
      átszámítása a ((átlagpontszám - 1) / 4) * 100 képlettel.

    related_metrics:
      - "AverageEngagementIndex"
      - "AverageSatisfactionIndex"
      - "AverageWorkLifeBalanceIndex"

    default_for_analysis: true

    interpretation_rule: >-
      Az 1-es átlagpontszám 0, a 3-as 50, az 5-ös pedig 100
      indexpontnak felel meg.

    restriction: >-
      Az indexpont nem százalék, és nem a kedvező válaszok aránya.

    documentation_status: "confirmed"


  - id: "composite_engagement_index"
    preferred_term: "összesített engagement-index"
    group: "engagement"

    synonyms:
      - "átfogó engagement-index"
      - "összetett engagement-index"
      - "composite engagement index"

    definition: >-
      Az AverageEngagementIndex, az AverageSatisfactionIndex és az
      AverageWorkLifeBalanceIndex egyenlő súlyú számtani átlaga.

    related_metric: "CompositeEngagementIndex"
    default_for_analysis: false

    usage_rule: >-
      Akkor használandó, ha a felhasználó kifejezetten összesített,
      összetett vagy átfogó engagement-indexet kér.

    restriction: >-
      Csak akkor számítható ki, ha mindhárom komponensindex rendelkezésre
      áll. Saját belső mutató, nem külsőleg validált mérőeszköz.

    documentation_status: "confirmed"

  - id: "top2_box"
    preferred_term: "Top2 Box arány"
    group: "engagement"

    synonyms:
      - "TOP2"
      - "kedvező válaszok aránya"
      - "pozitív válaszok aránya"
      - "magas értékelések aránya"
      - "top two box"

    definition: >-
      Az érvényes válaszok közül a 4-es vagy 5-ös értéket adó
      válaszok százalékos aránya.

    score_values:
      - 4
      - 5

    related_metrics:
      - "EngagementTop2BoxRate"
      - "SatisfactionTop2BoxRate"
      - "WorkLifeBalanceTop2BoxRate"

    restriction: >-
      Nem azonos az átlagpontszámmal vagy a 0–100-as indexszel.
      A 3-as válasz nem tartozik a Top2 Box kategóriába.

    documentation_status: "confirmed"


  - id: "low2_box"
    preferred_term: "Low2 Box arány"
    group: "engagement"

    synonyms:
      - "LOW2"
      - "kedvezőtlen válaszok aránya"
      - "negatív válaszok aránya"
      - "alacsony értékelések aránya"
      - "bottom two box"

    definition: >-
      Az érvényes válaszok közül az 1-es vagy 2-es értéket adó
      válaszok százalékos aránya.

    score_values:
      - 1
      - 2

    related_metrics:
      - "EngagementLow2BoxRate"
      - "SatisfactionLow2BoxRate"
      - "WorkLifeBalanceLow2BoxRate"

    restriction: >-
      Nem azonos az átlagpontszámmal vagy a 0–100-as indexszel.
      A 3-as válasz nem tartozik a Low2 Box kategóriába.

    documentation_status: "confirmed"


  - id: "survey_wave"
    preferred_term: "felmérési hullám"
    group: "engagement"

    synonyms:
      - "hullám"
      - "mérési hullám"
      - "survey wave"
      - "wave"

    definition: >-
      Egy meghatározott időpontban elindított munkavállalói felmérés
      és az ahhoz tartozó válaszok összessége.

    source_field: "SurveyWaveID"

    selection_rule: >-
      Megadott hullám hiányában a legutolsó elérhető hullámot kell
      használni. Több hullám eredményeit alapértelmezetten külön
      kell bemutatni.

    documentation_status: "confirmed"


  - id: "survey_response_rate"
    preferred_term: "felmérési válaszadási arány"
    group: "engagement"

    synonyms:
      - "válaszadási arány"
      - "kitöltési arány"
      - "response rate"
      - "survey participation rate"

    definition: >-
      Az adott hullámban válaszoló egyedi munkavállalók száma
      a felmérés indulásakor jogosult munkavállalók számához viszonyítva.

    related_metric: "SurveyResponseRate"

    eligibility_rule: >-
      Jogosult az a munkavállaló, akinek StartDate <= SurveyLaunchDate,
      és az ExitDate értéke üres vagy ExitDate > SurveyLaunchDate.

    restriction: >-
      A magas válaszadási arány önmagában nem zárja ki a válaszhiányból
      eredő szisztematikus torzítást.

    documentation_status: "confirmed"

  - id: "pooled_wave_result"
    preferred_term: "összevont hullámeredmény"
    group: "engagement"

    synonyms:
      - "hullámok összevonása"
      - "összesített hullámeredmény"
      - "pooled result"
      - "combined survey waves"

    definition: >-
      Több felmérési hullám válaszrekordjainak közös elemzésével
      előállított eredmény.

    related_metrics:
      - "PooledAverageEngagementIndex"
      - "PooledAverageSatisfactionIndex"
      - "PooledAverageWorkLifeBalanceIndex"
      - "PooledCompositeEngagementIndex"

    calculation_rule: >-
      Az összevonás válaszrekord-alapú: minden érvényes válasz azonos
      súlyt kap, ezért a nagyobb válaszadószámú hullám nagyobb hatással
      van az eredményre.

    usage_rule: >-
      Csak a felhasználó kifejezett kérésére használható. Alapértelmezetten
      a hullámokat külön kell bemutatni.

    documentation_status: "confirmed"


  - id: "wave_change"
    preferred_term: "hullámok közötti változás"
    group: "engagement"

    synonyms:
      - "változás a hullámok között"
      - "hullámközi változás"
      - "wave-over-wave change"
      - "survey trend"

    definition: >-
      Egy felmérési index későbbi és korábbi hullámban mért értékének
      különbsége.

    related_metrics:
      - "EngagementIndexChange"
      - "SatisfactionIndexChange"
      - "WorkLifeBalanceIndexChange"

    calculation_rule: >-
      Későbbi hullám indexértéke mínusz a korábbi hullám indexértéke.

    unit: "indexpont"

    interpretation_rule: >-
      A pozitív érték növekedést, a negatív érték csökkenést,
      a nulla változatlanságot jelent.

    restriction: >-
      A változás nem százalékos változás. Önmagában nem bizonyítja,
      hogy a két hullám közötti eltérés statisztikailag vagy
      gyakorlatilag jelentős.

    documentation_status: "confirmed"


  - id: "survey_respondent"
    preferred_term: "felmérési válaszadó"
    group: "engagement"

    synonyms:
      - "válaszadó"
      - "kitöltő"
      - "respondent"
      - "survey participant"

    definition: >-
      Az a munkavállaló, aki az adott felmérési hullámban érvényes
      válaszrekorddal rendelkezik.

    identification_fields:
      - "EmpID"
      - "SurveyWaveID"

    restriction: >-
      A felmérési eredmények közvetlenül a válaszadók véleményét írják
      le. Nem válaszadókra vagy a teljes munkavállalói állományra történő
      általánosításkor figyelembe kell venni a válaszhiány lehetséges
      torzítását.

    documentation_status: "confirmed"

  - id: "training_participant"
    preferred_term: "képzési résztvevő"
    group: "training"

    synonyms:
      - "résztvevő"
      - "képzésben részt vevő munkavállaló"
      - "training participant"
      - "trainee"

    definition: >-
      Olyan egyedi munkavállaló, akinek a vizsgált időszakban legalább
      egy Completed vagy Incomplete státuszú képzési rekordja van.

    related_metric: "TrainingParticipantCount"

    restriction: >-
      A Cancelled státuszú képzés nem számít részvételnek. Egy munkavállaló
      több képzési rekord esetén is csak egyszer számítandó.

    documentation_status: "confirmed"


