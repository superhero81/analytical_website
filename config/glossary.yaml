      - "p-value"
      - "significance probability"

    definition: >-
      Annak valószínűségét jelzi, hogy a megfigyelthez legalább ilyen
      szélsőséges eredmény adódna, ha a statisztikai próba nullhipotézise igaz.

    restriction: >-
      Nem annak valószínűsége, hogy a nullhipotézis igaz, és nem mutatja
      meg a különbség nagyságát vagy üzleti fontosságát.

    documentation_status: "confirmed"


  - id: "statistical_significance"
    preferred_term: "statisztikai szignifikancia"
    group: "statistics"

    synonyms:
      - "szignifikáns különbség"
      - "statistical significance"

    definition: >-
      Olyan statisztikai eredmény, amelynél az egyetlen vizsgálathoz
      tartozó vagy a többszörös tesztelés miatt korrigált p-érték
      kisebb a választott szignifikanciaszintnél.

    default_significance_level: 0.05
    related_rule: "statistical_significance"

    restriction: >-
      Csak indokolt következtető elemzés és megfelelően teljesülő
      próbafeltételek mellett állítható. Nem azonos a gyakorlati
      vagy üzleti jelentőséggel.

    documentation_status: "confirmed"


  - id: "confidence_interval"
    preferred_term: "konfidenciaintervallum"
    group: "statistics"

    synonyms:
      - "megbízhatósági intervallum"
      - "confidence interval"
      - "CI"

    definition: >-
      A becsült érték bizonytalanságát kifejező tartomány, amelyet
      meghatározott konfidenciaszinthez számítunk.

    default_confidence_level: 0.95

    interpretation_rule: >-
      A keskenyebb intervallum pontosabb, a szélesebb intervallum
      bizonytalanabb becslést jelez.

    restriction: >-
      Nem jelenti azt, hogy az adott egyszer kiszámított intervallum
      95%-os valószínűséggel tartalmazza a valódi értéket.

    documentation_status: "confirmed"


  - id: "effect_size"
    preferred_term: "hatásméret"
    group: "statistics"

    synonyms:
      - "hatás nagysága"
      - "effect size"

    definition: >-
      A csoportok közötti eltérés vagy a változók közötti kapcsolat
      nagyságát számszerűsítő mutató.

    related_rule: "effect_size_reporting"

    interpretation_rule: >-
      A p-érték mellett kell közölni, és az üzleti, HR- és módszertani
      környezettel együtt kell értelmezni.

    restriction: >-
      Általános küszöbérték alapján önmagában nem minősíthető fontosnak
      vagy jelentéktelennek.

    documentation_status: "confirmed"


  - id: "practical_significance"
    preferred_term: "gyakorlati jelentőség"
    group: "statistics"

    synonyms:
      - "üzleti jelentőség"
      - "érdemi különbség"
      - "practical significance"
      - "business relevance"

    definition: >-
      Annak megítélése, hogy egy eltérés vagy kapcsolat nagysága
      HR- vagy üzleti szempontból számottevő-e.

    related_rule: "practical_significance"

    interpretation_rule: >-
      A tényleges különbség, a hatásméret, a konfidenciaintervallum,
      az elemszám és az üzleti környezet együttesen értékelendő.

    restriction: >-
      Pusztán a p-érték alapján egy eredmény nem minősíthető fontosnak
      vagy döntést megalapozónak.

    documentation_status: "confirmed"

  - id: "multiple_testing"
    preferred_term: "többszörös statisztikai tesztelés"
    group: "statistics"

    synonyms:
      - "többszörös összehasonlítás"
      - "multiple testing"
      - "multiple comparisons"

    definition: >-
      Több statisztikai próba egyidejű alkalmazása, amely növeli
      legalább egy téves pozitív eredmény valószínűségét.

    related_rule: "multiple_testing_correction"

    correction_methods:
      planned_comparisons: "Holm-korrekció"
      exploratory_many_tests: "Benjamini–Hochberg FDR-korrekció"

    restriction: >-
      Több összehasonlítás esetén korrigálatlan p-érték alapján
      nem állítható statisztikai szignifikancia.

    documentation_status: "confirmed"


  - id: "correlation"
    preferred_term: "korreláció"
    group: "statistics"

    synonyms:
      - "együttjárás"
      - "statisztikai kapcsolat"
      - "correlation"

    definition: >-
      Két változó együttmozgásának irányát és erősségét leíró
      statisztikai kapcsolat.

    related_rule: "correlation_analysis"

    interpretation_rule: >-
      Pozitív korrelációnál a változók jellemzően azonos, negatív
      korrelációnál ellentétes irányban változnak.

    restriction: >-
      A korreláció nem bizonyít oksági kapcsolatot.

    documentation_status: "confirmed"


  - id: "causality"
    preferred_term: "oksági kapcsolat"
    group: "statistics"

    synonyms:
      - "ok-okozati kapcsolat"
      - "kauzalitás"
      - "causality"
      - "causal effect"

    definition: >-
      Olyan kapcsolat, amelyben az egyik tényező változása ténylegesen
      előidézi a másik tényező változását.

    related_rule: "causal_inference_restriction"

    restriction: >-
      A projekt megfigyeléses HR-adataiból oksági kapcsolat nem
      állapítható meg. Csak együttjárás, különbség vagy kapcsolat jelezhető.

    documentation_status: "confirmed"


  - id: "nonresponse_bias"
    preferred_term: "válaszhiányból eredő torzítás"
    group: "statistics"

    synonyms:
      - "nemválaszolási torzítás"
      - "nonresponse bias"
      - "response bias"

    definition: >-
      Olyan torzítás, amely akkor keletkezhet, ha a felmérésre válaszolók
      és nem válaszolók összetétele vagy véleménye rendszeresen eltér.

    related_rule: "nonresponse_bias_analysis"

    analysis_rule: >-
      A válaszadási arányokat és a válaszolók összetételét elérhető
      munkavállalói jellemzők szerint is vizsgálni kell.

    restriction: >-
      A 70–80%-os válaszadási arány sem zárja ki automatikusan
      a szisztematikus válaszhiányt.

    documentation_status: "confirmed"


  - id: "weighting"
    preferred_term: "statisztikai súlyozás"
    group: "statistics"

    synonyms:
      - "minta súlyozása"
      - "utólagos súlyozás"
      - "weighting"
      - "survey weighting"

    definition: >-
      A megfigyelések eltérő súllyal történő figyelembevétele annak
      érdekében, hogy az eredmények jobban tükrözzék a célzott sokaságot.

    related_rule: "weighting_rule"
    current_project_setting: "unweighted"

    restriction: >-
      A demóban demográfiai vagy szervezeti súlyozás nem alkalmazható.
      Ilyen súlyozás később csak külön dokumentált módszertani szabály
      alapján vezethető be.

    documentation_status: "confirmed"

  - id: "minimum_sample_for_inference"
    preferred_term: "minimális elemszám következtető elemzéshez"
    group: "statistics"

    synonyms:
      - "statisztikai minimum elemszám"
      - "minimum sample size"
      - "minimum group size for inference"

    definition: >-
      A statisztikai következtetéshez szükséges legkisebb csoportonkénti
      megfigyelésszám.

    default_minimum_per_group: 20
    related_rule: "minimum_sample_for_inference"

    restriction: >-
      A 20 fős minimum nem garantál megfelelő statisztikai erőt.
      Kis mintánál a nem szignifikáns eredmény nem bizonyítja,
      hogy nincs különbség.

    documentation_status: "confirmed"


  - id: "repeated_observations"
    preferred_term: "ismételt megfigyelések"
    group: "statistics"

    synonyms:
      - "ismételt mérések"
      - "többszörös rekordok"
      - "repeated observations"
      - "repeated measures"

    definition: >-
      Ugyanahhoz a munkavállalóhoz tartozó több felmérési válasz
      vagy képzési rekord.

    related_rule: "repeated_observations"

    restriction: >-
      Az azonos munkavállalóhoz tartozó rekordok nem tekinthetők
      automatikusan egymástól független megfigyeléseknek.

    documentation_status: "confirmed"


  - id: "missing_value"
    preferred_term: "hiányzó érték"
    group: "statistics"

    synonyms:
      - "adathiány"
      - "üres érték"
      - "missing value"
      - "null value"

    definition: >-
      Olyan mezőérték, amely az adott rekordban nincs rögzítve.

    related_rule: "analytical_missing_data_handling"

    interpretation_rule: >-
      A hiányzó érték jelentését mezőnként kell meghatározni.
      Nem kezelhető automatikusan nullaként vagy negatív válaszként.

    documentation_status: "confirmed"


  - id: "outlier"
    preferred_term: "kiugró érték"
    group: "statistics"

    synonyms:
      - "szélsőséges érték"
      - "outlier"
      - "extreme value"

    definition: >-
      A többi megfigyeléstől szokatlanul nagy mértékben eltérő érték.

    related_rule: "outlier_handling"

    restriction: >-
      Kiugró érték nem törölhető automatikusan. Először ellenőrizni kell,
      hogy adathiba, valós ritka eset vagy az eloszlás természetes része-e.

    documentation_status: "confirmed"


  - id: "confounding"
    preferred_term: "zavaró tényező"
    group: "statistics"

    synonyms:
      - "háttértényező"
      - "confounder"
      - "confounding variable"

    definition: >-
      Olyan harmadik változó, amely összefügghet a vizsgált tényezővel
      és az eredménnyel is, ezért torzíthatja a megfigyelt kapcsolatot.

    related_rule: "confounding_and_adjustment"

    restriction: >-
      A háttértényezőkre korrigált statisztikai kapcsolat sem bizonyít
      önmagában oksági hatást.

    documentation_status: "confirmed"

  - id: "aggregated_result"
    preferred_term: "aggregált eredmény"
    group: "privacy"

    synonyms:
      - "összesített eredmény"
      - "csoportszintű eredmény"
      - "aggregate result"

    definition: >-
      Több személy vagy rekord adatainak közös mutatóként, például
      átlagként, arányként vagy elemszámként történő megjelenítése.

    restriction: >-
      Az eredményből egyéni válasz vagy egyéni teljesítmény nem lehet
      közvetlenül visszafejthető.

    documentation_status: "confirmed"


  - id: "minimum_reporting_group_size"
    preferred_term: "minimális közölhető csoportméret"
    group: "privacy"

    synonyms:
      - "minimum csoportlétszám"
      - "minimum elemszám"
      - "minimum reporting group size"

    definition: >-
      Az aggregált eredmény megjelenítéséhez szükséges legkisebb
      csoportonkénti elemszám.

    default_minimum: 4

    exception: >-
      Konkrét oktató aggregált értékelése már egy választól megjeleníthető,
      de az elemszámot minden esetben közölni kell.

    restriction: >-
      Nem azonos a következtető statisztikai elemzéshez előírt,
      csoportonként legalább 20 megfigyeléssel.

    documentation_status: "confirmed"


  - id: "result_suppression"
    preferred_term: "eredmény elrejtése"
    group: "privacy"

    synonyms:
      - "kis elemszámú eredmény elnyomása"
      - "adatközlés korlátozása"
      - "result suppression"
      - "cell suppression"

    definition: >-
      Egy eredmény megjelenítésének mellőzése, ha a közlés adatvédelmi
      vagy módszertani szabályt sértene.

    application_rule: >-
      Az általános szabály szerint az 1–3 fős munkavállalói csoportok
      eredménye nem közölhető.

    documentation_status: "confirmed"


  - id: "individual_record"
    preferred_term: "egyéni rekord"
    group: "privacy"

    synonyms:
      - "személyszintű rekord"
      - "egyéni válasz"
      - "individual record"
      - "person-level data"

    definition: >-
      Egy meghatározott vagy meghatározható munkavállalóhoz tartozó
      foglalkoztatási, felmérési, képzési vagy értékelési adat.

    output_allowed: false

    restriction: >-
      Egyéni képzési, teljesítési vagy visszajelzési rekord, illetve
      egyéni felmérési válasz nem jeleníthető meg.

    documentation_status: "confirmed"

  - id: "training_purpose"
    preferred_term: "képzés célja"
    group: "training"

    synonyms:
      - "képzési cél"
      - "részvétel indoka"
      - "training purpose"

    definition: >-
      A képzés elvégzésének szervezeti vagy munkavállalói indoka.

    source_field: "TrainingPurpose"

    value_definitions:
      Mandatory: "Jogszabály, szabályzat vagy vállalati előírás alapján kötelező képzés."
      Job Required: "A munkakör eredményes ellátásához szükséges képzés."
      Employee Initiated: "A munkavállaló kezdeményezésére választott képzés."

    documentation_status: "confirmed"


  - id: "training_completion_status"
    preferred_term: "képzési teljesítési státusz"
    group: "training"

    synonyms:
      - "képzés státusza"
      - "teljesítési állapot"
      - "completion status"

    definition: >-
      A képzési rekord befejezettségének állapota.

    source_field: "CompletionStatus"

    value_definitions:
      Completed: "A képzés sikeresen befejeződött."
      Incomplete: "A képzés elkezdődött, de nem fejeződött be."
      Cancelled: "A képzést törölték; nem számít részvételnek."

    documentation_status: "confirmed"


  - id: "training_result"
    preferred_term: "képzési vizsgaeredmény"
    group: "training"

    synonyms:
      - "vizsgaeredmény"
      - "értékelési eredmény"
      - "training result"
      - "assessment result"

    definition: >-
      A vizsgával vagy értékeléssel záruló képzés teljesítési eredménye.

    source_field: "TrainingResult"

    value_definitions:
      Passed: "A résztvevő teljesítette az előírt követelményt."
      Failed: "A résztvevő nem teljesítette az előírt követelményt."

    restriction: >-
      Csak olyan képzésnél értelmezhető, amelyhez vizsga vagy formális
      értékelés tartozik.

    documentation_status: "confirmed"


  - id: "feedback_submitted"
    preferred_term: "képzési visszajelzés leadása"
    group: "training"

    synonyms:
      - "értékelés kitöltése"
      - "visszajelzés beküldése"
      - "feedback submitted"

    definition: >-
      Azt jelzi, hogy a résztvevő leadott-e értékelést az adott képzésről.

    source_field: "FeedbackSubmitted"

    value_definitions:
      "Yes": "A résztvevő visszajelzést adott."
      "No": "A résztvevő nem adott visszajelzést."

    restriction: >-
      A visszajelzés leadása nem azonos a pozitív értékeléssel.

    documentation_status: "confirmed"

  - id: "rate"
    preferred_term: "arány"
    group: "statistics"

    synonyms:
      - "ráta"
      - "rate"
      - "percentage"

    definition: >-
      Egy meghatározott számláló és nevező hányadosa, amelyet a projekt
      mutatói jellemzően százalékos formában jelenítenek meg.

    restriction: >-
      Az arány csak a számláló, a nevező és az időszak egyértelmű
      meghatározásával értelmezhető.

    documentation_status: "confirmed"


  - id: "unique_employee"
    preferred_term: "egyedi munkavállaló"
    group: "workforce"

    synonyms:
      - "különálló munkavállaló"
      - "unique employee"
      - "distinct employee"

    definition: >-
      EmpID alapján egyszer számított munkavállaló, függetlenül attól,
      hogy hány kapcsolódó felmérési vagy képzési rekordja van.

    identification_field: "EmpID"

    documentation_status: "confirmed"


  - id: "organizational_group"
    preferred_term: "szervezeti csoport"
    group: "workforce"

    synonyms:
      - "szervezeti egység"
      - "munkavállalói csoport"
      - "organizational group"
      - "employee segment"

    definition: >-
      A munkavállalók valamely használható szervezeti, demográfiai
      vagy foglalkoztatási jellemző alapján képzett csoportja.

    restriction: >-
      Csak az adatállomány-katalógusban elemzésre engedélyezett mezők
      használhatók csoportképzésre. Az adatvédelmi minimumlétszámot
      minden esetben alkalmazni kell.

    documentation_status: "confirmed"


  - id: "sensitive_personal_attribute"
    preferred_term: "érzékeny személyes jellemző"
    group: "privacy"

    synonyms:
      - "érzékeny demográfiai adat"
      - "sensitive personal attribute"
      - "sensitive demographic data"

    definition: >-
      Olyan személyes jellemző, amelynek elemzése és közlése fokozott
      adatvédelmi körültekintést igényel.

    output_rule: >-
      Csak engedélyezett célból, aggregáltan és a vonatkozó
      minimumlétszám betartásával használható.

    documentation_status: "confirmed"


  - id: "full_time_equivalent"
    preferred_term: "teljes munkaidős egyenérték"
    group: "workforce"

    synonyms:
      - "FTE"
      - "full-time equivalent"
      - "teljes munkaidőre vetített létszám"

    definition: >-
      A munkaidő alapján teljes munkaidős állásokra átszámított
      foglalkoztatási kapacitás.

    available_in_data: false
    related_metric: null

    restriction: >-
      A projekt létszámmutatói személyeket, nem FTE-kapacitást mérnek.
      FTE az elérhető adatokból nem számítható.

    documentation_status: "confirmed"
